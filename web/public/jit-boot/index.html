<!-- Full boot of iPhone OS 1.0 (1A543a) in the browser: the WebAssembly JIT,
     the panel painted from the guest framebuffer, touch and buttons, and the
     NAND streamed as Brotli'd chunks instead of a 215 MiB up-front download.

     Serve with scripts/wasm/serve.py -- the COOP/COEP headers are required for
     SharedArrayBuffer, and the chunks are stored already-compressed so they
     need the dev server's Content-Encoding: br. Then open /public/jit-boot/.

     Verify the delivery by BYTES, not by belief: /__chunk-stats reports what
     the server actually shipped. Expect ~18.5 MiB cold and ~0 warm. -->
<title>iPhone OS 1.0 in the browser</title>
<style>
  body { font: 13px ui-monospace, Menlo, monospace; margin: 0; padding: 1rem;
         background: #14161a; color: #d7dae0;
         display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1rem;
         align-items: start; }
  h1 { font-size: 14px; margin: 0 0 .75rem; color: #9aa4b2; font-weight: 600;
       grid-column: 1 / -1; }
  #device { display: flex; flex-direction: column; align-items: center;
            gap: .5rem; }
  /* image-rendering: pixelated keeps the 320x480 panel honest when scaled. */
  canvas { width: 320px; height: 480px; background: #000; border-radius: 6px;
           image-rendering: pixelated; touch-action: none; cursor: pointer; }
  #buttons { display: flex; gap: .5rem; }
  button { font: inherit; background: #2a2f39; color: #d7dae0; border: 0;
           border-radius: 4px; padding: .4rem .9rem; cursor: pointer; }
  button:active { background: #3a4150; }
  #fbstat { color: #7f8896; }
  #tipfix, .viz { color: #7f8896; display: flex; align-items: center;
            gap: .35rem; cursor: pointer; user-select: none; }
  /* Overlays sit on the canvas but must never eat its pointer events. */
  #panelwrap { position: relative; overflow: hidden; border-radius: 6px;
               line-height: 0; }
  #finger { position: absolute; left: 0; top: 0; pointer-events: none;
            opacity: .8; will-change: transform; }
  .tapdot, .clickmark { position: absolute; pointer-events: none;
            transform: translate(-50%, -50%); border-radius: 50%;
            transition: opacity 1.1s ease-out .3s; }
  .tapdot { width: 12px; height: 12px; background: #007aff;
            border: 2px solid #fff; box-shadow: 0 0 6px #007affcc; }
  .clickmark { width: 10px; height: 10px; border: 2px solid #ffffffb0;
            background: transparent; }
  #state { padding: .5rem .75rem; border-radius: 4px; background: #22262e;
           margin-bottom: .5rem; }
  #marks { padding: .5rem .75rem; border-radius: 4px; background: #1b1f26;
           margin-bottom: .75rem; white-space: pre; color: #8fd694; }
  .ok   { border-left: 3px solid #4ac26b; }
  .fail { border-left: 3px solid #e5534b; }
  #log { white-space: pre-wrap; line-height: 1.4; max-height: 70vh;
         overflow-y: auto; }
  .err { color: #e5a3a0; }
</style>
<h1>iPhone OS 1.0 — full boot, WebAssembly JIT</h1>
<div id="device">
  <div id="panelwrap">
    <canvas id="screen" width="320" height="480"></canvas>
    <!-- A finger at true scale. The panel is 6.4 px/mm (320 px / 50 mm), so a
         ~14 mm adult fingertip is ~90 px wide -- it really did cover more than
         a quarter of the screen's width, and showing that occlusion is the
         point: it is WHY iPhone OS shifts every contact upward. -->
    <svg id="finger" width="96" height="360" viewBox="0 0 96 360"
         style="display:none">
      <defs>
        <linearGradient id="fgrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#d9a184"/>
          <stop offset=".45" stop-color="#eebd9e"/>
          <stop offset="1"   stop-color="#cf9276"/>
        </linearGradient>
      </defs>
      <path d="M 8 52 C 8 18 28 4 48 4 C 68 4 88 18 88 52
               L 92 200 C 94 280 90 360 90 360 L 10 360
               C 10 360 4 280 6 200 Z"
            fill="url(#fgrad)" stroke="#b07a5e" stroke-width="1.5"/>
      <path d="M 26 30 C 30 16 42 10 48 10 C 54 10 66 16 70 30"
            fill="none" stroke="#c48b6d" stroke-width="2" opacity=".5"/>
    </svg>
  </div>
  <div id="buttons">
    <button id="home">Home (H)</button>
    <button id="power">Power (P)</button>
  </div>
  <label id="tipfix" title="iPhone OS deliberately shifts every touch upward to
compensate for a fingertip occluding its target -- SBFingerProjection, 3.5
typographic points = 1.2347 mm. A mouse is exact and occludes nothing, so that
compensation lands your click above the pointer. Tick this to add it back.">
    <input type="checkbox" id="tipfixbox"> <span id="tipfixlabel">correct finger offset</span>
  </label>
  <label class="viz" title="Replace the cursor with a finger at the panel's real
scale (6.4 px/mm): a fingertip covered more than a quarter of the screen's
width, which is why iPhone OS compensates upward at all.">
    <input type="checkbox" id="fingerbox"> finger cursor
  </label>
  <label class="viz" title="On every click, mark in blue where iPhone OS
actually computes the tap -- above your click by the measured shift. With
'correct finger offset' ticked the blue dot lands on the click itself.">
    <input type="checkbox" id="tapdotbox"> show OS tap point
  </label>
  <label class="viz" title="The emulator offers every frame (~66 Hz) and the
page accepts on requestAnimationFrame -- the browser's vsync, usually 60 Hz,
which is also the real panel's rate. Each accepted frame costs a full
153k-pixel blit (there is no damage tracking), sub-ms on a desktop; tick this
to cap acceptance at 30 Hz on a constrained host. The fps readout below is
MEASURED accepted frames, so a silent regression of this path shows up in
plain view. An occluded tab reads ~0 fps by design: rAF is suspended, the
guest keeps running.">
    <input type="checkbox" id="hz30box"> cap refresh at 30 Hz (save CPU)
  </label>
  <div id="fbstat">panel: no frames yet</div>
</div>
<div>
  <div id="state">loading…</div>
  <div id="marks">(no landmarks yet)</div>
  <div id="log"></div>
</div>
<script type="module">
  const logEl = document.getElementById('log');
  const stateEl = document.getElementById('state');
  const marksEl = document.getElementById('marks');
  const fbstatEl = document.getElementById('fbstat');
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d', { alpha: false });
  const t0 = performance.now();
  const at = () => ((performance.now() - t0) / 1000).toFixed(1).padStart(7);

  // Landmarks in boot order. `hit` is filled with the elapsed seconds so the
  // page itself is the measurement, readable without a debugger attached.
  // "first pixels" is not a serial landmark: SpringBoard never announces
  // itself, so the framebuffer is the only honest evidence it is up.
  // On a ?resume=1 run these never fire -- the guest is already past them and
  // its serial output is whatever the restored kernel replays. The framebuffer
  // landmarks ("first pixels", "home screen") are the ones that matter there.
  const LANDMARKS = [
    ['iBoot banner',   t => t.includes('BUILD_TAG')],
    ['kernel',         t => t.includes('Darwin Kernel Version')],
    ['BSD root',       t => t.includes('BSD root:')],
    ['launchd',        t => t.includes('BOOT_TIME')],
  ];
  const hit = new Map();
  let failed = null;
  let fsRef = null;      // MEMFS, captured in preRun so serial.log can be read
  let moduleRef = null;  // the MAIN THREAD's Module -- see the note below
  let serialSeen = 0;    // bytes of guest serial already rendered
  let touchReady = false;  // the guest's input gate has armed
  // bytesFromNetwork, NOT bytesServed: the latter counts cache hits too, so a
  // warm boot would report the full working set and look like it downloaded it.
  let chunkBytes = 0;
  let chunkHits = 0, chunkMisses = 0;

  function renderMarks() {
    const rows = LANDMARKS.map(([name]) =>
      `${hit.has(name) ? hit.get(name).padStart(8) : '       —'}  ${name}`);
    for (const [name, when] of hit) {
      if (!LANDMARKS.some(([n]) => n === name)) {
        rows.push(`${when.padStart(8)}  ${name}`);
      }
    }
    marksEl.textContent = rows.join('\n');
  }
  renderMarks();

  // Post landmarks back to scripts/wasm/serve.py --results, so a run can be
  // driven headlessly instead of by watching a tab. A watched tab is not just
  // inconvenient: Chrome throttles a backgrounded or occluded page and the
  // freeze is indistinguishable from a hang -- which is exactly how this
  // page's first 1206 s boot came to be misread.
  //
  // Same endpoint as web/bench-b/, deliberately. What this page adds is the
  // landmark bench-b cannot have: SpringBoard is NEVER announced on serial, so
  // "home screen" can only be established from the framebuffer, and only a
  // page that paints can see it.
  let lastReport = 0;
  let reportEndpoint = true;   // cleared on a static host
  function report(force) {
    const now = performance.now();
    if (!force && now - lastReport < 5000) return;
    lastReport = now;
    const body = JSON.stringify({
      elapsed: Number((now / 1000).toFixed(1)),
      landmarks: Object.fromEntries(
        [...hit].map(([k, v]) => [k, Number(parseFloat(v).toFixed(1))])),
      frames,
      nonBlackPct,
      guestRatio: Number(guestRatio.toFixed(4)),
      guestMs: guestMs(),
      chunkBytes,
      chunkHits,
      chunkMisses,
      sweep: sweepResult,
      failure: failed,
    });
    // fetch(), not sendBeacon(): beacons from a standalone headless Chrome are
    // silently dropped (bench-b found this the hard way).
    //
    // The failure is logged rather than swallowed. A headless run has no other
    // channel: `--enable-logging=stderr` is the ONLY way to see what a page is
    // doing, and a silent .catch() here left a run looking dead for ten minutes
    // with the server showing no POSTs and no way to tell why.
    // On a STATIC host there is no /__bench-result, so this 404s every 15 s.
    // Give up after the first failure rather than filling a real deployment's
    // console with errors -- but say so once, because a silent .catch() here is
    // what once left a run looking dead with no way to ask why.
    if (!reportEndpoint) return;
    fetch('/__bench-result', { method: 'POST', body, keepalive: true })
      .then((r) => {
        if (!r.ok && r.status === 404) {
          reportEndpoint = false;
          console.log('[bench] no /__bench-result endpoint; stopping reports');
        }
      })
      .catch((e) => {
        reportEndpoint = false;
        console.error('[bench] report POST failed, stopping reports:', e);
      });
  }
  // A heartbeat, so a headless run says something every 15 s even before the
  // first landmark. Silence then means the page is genuinely wedged, which is
  // the distinction that was impossible to draw without it.
  //
  // It also carries the chunk byte count, because that is the ONLY honest check
  // on chunked delivery: the page believing it streamed is not evidence.
  setInterval(async () => {
    let bytes = '';
    try {
      const st = await chunkStats();
      if (st) {
        chunkBytes = st.bytesFromNetwork ?? 0;
        chunkHits = st.hits ?? 0;
        chunkMisses = st.misses ?? 0;
        bytes = ` net=${(chunkBytes / 1048576).toFixed(2)}MiB`
                + ` hit=${chunkHits}/${chunkHits + chunkMisses}`;
      }
    } catch (e) { /* the worker may not be controlling yet */ }
    console.log(`[bench] t=${at()}s frames=${frames} nonBlack=${nonBlackPct}%`
                + ` guestRatio=${guestRatio.toFixed(4)}${bytes}`
                + ` landmarks=${[...hit.keys()].join(',') || 'none'}`);
    report(true);
  }, 15000);

  function mark(name) {
    if (!hit.has(name)) {
      hit.set(name, at());
      renderMarks();
      // Console, not just the DOM: under --headless there is no DOM to look at.
      console.log(`[bench] landmark ${name} at ${at()}s`);
      report(true);
    }
  }

  function state(text, cls) { stateEl.textContent = text; stateEl.className = cls || ''; }

  function line(text, cls) {
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.textContent = `[${at()}s] ${text}`;
    logEl.appendChild(el);
    if (logEl.childElementCount > 300) logEl.firstElementChild.remove();
    logEl.scrollTop = logEl.scrollHeight;
  }

  function note(text) {
    for (const [name, test] of LANDMARKS) {
      if (!hit.has(name) && test(text)) { mark(name); }
    }
    // The guest's own verdict on every touch, mirrored to the console because
    // it is the only way to tell a REFUSED touch from an unregistered one.
    //
    // lcd_update_input_ready() refuses all input until it has seen
    // 2 * LCD_REFRESH_RATE_FREQUENCY frames of a stable OS image -- two seconds
    // of GUEST time, which at a ratio of 0.018 is about 110 seconds of WALL
    // time. Any press sweep that starts tapping before that measures the gate,
    // not the press.
    // [BTN] and ONKEY too: without them a headless run cannot tell "the button
    // never reached the guest" from "it reached the guest and nothing happened",
    // which is exactly the distinction the in-app HOME bug turns on.
    if (/\[BTN\]|ONKEY|\[WASM\]/.test(text)) {
      console.log(`[guest] ${text.trim()}`);
    }
    // ?qsp=1 exists to be read HEADLESSLY, and qsp_report()'s table carries
    // no greppable marker -- so in that mode mirror every guest line.
    if (QSP_MODE) {
      console.log(`[guest] ${text.trim()}`);
    }
    if (/\[TOUCH\]|\[LCD\] (Touch input|Retained touch)/.test(text)) {
      console.log(`[guest] ${text.trim()}`);
      // Three variants, one gate: "Touch input ready" (cold boot),
      // "Retained touch input ready" (wake after Z2 reload), and "Touch
      // input restored after wake" — the one a RESUME prints, whose absence
      // from this regex hung ?sweep=calc at the gate for two whole runs.
      if (/Touch input (ready|restored)|Retained touch input ready/
          .test(text)) {
        touchReady = true;
      }
    }
    if (/panic\(|kernel abort|hardware error/.test(text)) {
      failed = text.slice(0, 120);
      state(`guest failure: ${failed}`, 'fail');
    }
  }

  addEventListener('error', (e) => {
    const msg = String(e.message || e.error);
    failed = msg;
    state(`emulator failure: ${msg.slice(0, 140)}`, 'fail');
    line(`window error: ${msg}`, 'err');
    console.error('[bench] window error:', msg);
  });

  // The guest writes serial into MEMFS; the emulator runs on a worker but
  // shares memory, so the file can be read from here. Poll it and render what
  // is new.
  setInterval(() => {
    if (!fsRef) return;
    let data;
    try {
      data = fsRef.readFile('/fw/serial.log', { encoding: 'utf8' });
    } catch (e) {
      return;                       // not created until the guest writes
    }
    if (data.length <= serialSeen) return;
    const fresh = data.slice(serialSeen);
    serialSeen = data.length;
    for (const text of fresh.split('\n')) {
      if (text.trim()) { note(text); line(text); }
    }
  }, 1000);

  // ------------------------------------------------------------- display ---
  //
  // ui/wasm.c does not draw and does not publish anything onto `Module`: with
  // -sPROXY_TO_PTHREAD the emulator runs on a worker whose `Module` is a
  // different object from this one, so an EM_JS assignment there would be
  // invisible here. Instead it exports the ADDRESS of a small struct, and both
  // threads look at the same shared linear memory.
  //
  // Struct layout (all u32; see WasmDisplayInfo in ui/wasm.c):
  //   0 seq  1 width  2 height  3 stride  4 pixels_lo  5 pixels_hi
  //   6 damage_x  7 damage_y  8 damage_w  9 damage_h  10 ack  11 guest_ms
  //
  // `ack` is the one field written from here: the seq this page last painted.
  // The emulator side needs it to know when it may stop accumulating damage
  // into one rectangle. This page repaints in full and ignores the rectangle,
  // but writing the ack keeps it meaningful for a partial-blit consumer.
  //
  // `seq` is a seqlock -- odd while the emulator thread is mid-update. Reading
  // the fields without honouring it can catch a half-written pointer, and a
  // half-written pointer indexed into HEAPU8 reads arbitrary memory rather
  // than merely tearing a frame.
  let infoBase = -1;            // struct address >> 2
  let lastSeq = -1;
  // preRun runs BEFORE the runtime is initialized, so having `moduleRef` is not
  // the same as being allowed to call into it. Emscripten's pre-init exports
  // are assert stubs that abort with "native function ... called before runtime
  // initialization" -- and they ARE functions, so a `typeof fn === 'function'`
  // guard sails straight past them and kills the emulator.
  //
  // This was a live race, not a theoretical one: an interactive run happened to
  // fire its first animation frame after init and worked, while a headless run
  // with a warm cache staged the assets faster, painted first, and aborted the
  // runtime ~2 s in on every single frame.
  let runtimeReady = false;
  let imageData = null;
  let imageWords = null;        // u32 view over imageData.data
  let frames = 0;
  let nonBlackPct = 0;          // reported: the only evidence SpringBoard is up

  // Guest seconds per wall second, sampled from the emulator's own
  // QEMU_CLOCK_VIRTUAL. With -icount, boot DURATION and guest SPEED are
  // different quantities and only this ratio answers "is it real-time": 1.0
  // would mean the guest experiences one second per second, as the hardware
  // did. It is also what sizes the press hold -- see MIN_PRESS_GUEST_MS.
  let guestRatio = 0;
  let ratioSample = null;       // {wallMs, guestMs} taken a while back

  function guestMs() {
    if (!moduleRef || !runtimeReady || infoBase < 0) return null;
    try {
      return moduleRef.HEAPU32[infoBase + 11];
    } catch (e) {
      return null;
    }
  }

  function sampleRatio() {
    const g = guestMs();
    if (g === null) return;
    const now = performance.now();
    if (!ratioSample) { ratioSample = { wallMs: now, guestMs: g }; return; }
    const dWall = now - ratioSample.wallMs;
    const dGuest = g - ratioSample.guestMs;
    if (dWall < 3000) return;                  // too short a base to be stable
    if (dGuest >= 0) guestRatio = dGuest / dWall;
    ratioSample = { wallMs: now, guestMs: g };
  }
  setInterval(sampleRatio, 1000);

  function readDisplayInfo(u32) {
    for (let attempt = 0; attempt < 4; attempt++) {
      const s0 = Atomics.load(u32, infoBase);
      if (s0 & 1) continue;                       // writer in progress
      const width = u32[infoBase + 1];
      const height = u32[infoBase + 2];
      const stride = u32[infoBase + 3];
      const lo = u32[infoBase + 4];
      const hi = u32[infoBase + 5];
      if (Atomics.load(u32, infoBase) !== s0) continue;
      return { seq: s0, width, height, stride, ptr: lo + hi * 4294967296 };
    }
    return null;
  }

  // The surface is 32bpp x8r8g8b8: rgb_to_pixel32() in hw/arm/ipod_touch_lcd.c
  // stores (r<<16)|(g<<8)|b as a native u32, which on a little-endian host is
  // B,G,R,X in memory. ImageData wants R,G,B,A. Doing the swizzle as one u32
  // shuffle per pixel is ~150k operations a frame at 10 Hz -- negligible, and
  // far cheaper than four byte reads.
  function blit(src, srcWordOffset, rowWords, width, height) {
    let nonBlack = 0;
    for (let y = 0; y < height; y++) {
      let s = srcWordOffset + y * rowWords;
      let d = y * width;
      for (let x = 0; x < width; x++, s++, d++) {
        const p = src[s];
        if (p & 0x00ffffff) nonBlack++;
        imageWords[d] = 0xff000000 | ((p & 0xff) << 16) | (p & 0xff00) |
                        ((p >>> 16) & 0xff);
      }
    }
    return nonBlack;
  }

  // Reading a runtime method Emscripten did not export does not return
  // undefined -- the stub calls abort(), which tears down the whole runtime and
  // takes the emulator with it. Painting is a nice-to-have; it must never be
  // able to kill the boot, so every module property is reached through this and
  // the paint loop switches itself off after the first failure.
  // ?paint=0 keeps -display wasm and the non-black measurement but skips the
  // per-frame blit. Under -sPROXY_TO_PTHREAD the MAIN thread both paints and
  // services the emulator thread's proxied MEMFS syscalls, so a heavy blit can
  // in principle starve a guest that is doing a lot of filesystem work -- which
  // is exactly the difference between this page and web/bench-b/ (which never
  // paints) on the 1.1.4 chunked boot.
  const PAINT = new URLSearchParams(location.search).get('paint') !== '0';
  const QSP_MODE = new URLSearchParams(location.search).get('qsp') === '1';

  // Safari/JSC dies mid-boot with `RangeError: Maximum call stack size
  // exceeded` ~20 frames into TB translation: JSC puts wasm frames on the
  // worker's small NATIVE stack, and its pre-optimizer tiers make very large
  // frames for very large functions (QEMU's Thumb decoder). No Emscripten
  // flag reaches that stack (the wasm linear stack IS sized correctly --
  // that was a different, fixed crash). Say it up front instead of letting
  // the machine die silently at ~40 s. Feature-detected the boring way: JSC
  // is the only engine without chrome.* that still reports Safari in the UA.
  const isJSC = /Safari\//.test(navigator.userAgent)
    && !/Chrom(e|ium)|Edg\//.test(navigator.userAgent);
  if (isJSC) {
    const warn = document.createElement('div');
    warn.style.cssText = 'background:#7a2020;color:#fff;padding:10px 14px;'
      + 'margin:8px 0;border-radius:6px;font-weight:bold';
    warn.textContent = '⚠️ Safari is not supported yet: its JavaScript '
      + 'engine overflows the native stack while the emulator compiles code '
      + '(RangeError ~40 s in, machine dies). Use a Chromium browser — '
      + 'Chrome, Edge, Arc, Brave. Newer Safari versions are untested and '
      + 'may fare better.';
    document.body.prepend(warn);
  }
  let displayBroken = false;
  function moduleProp(name) {
    try {
      return moduleRef[name];
    } catch (e) {
      displayBroken = true;
      state(`display disabled: Module.${name} unavailable (${e})`, 'fail');
      line(`display disabled: Module.${name} unavailable`, 'err');
      return undefined;
    }
  }

  // Accept rate. The emulator OFFERS every frame (~66 Hz, one seq bump per
  // 15 ms drain tick); the page accepts on rAF -- the browser's vsync,
  // usually 60 Hz, which is the real panel's rate too. The 30 Hz cap is the
  // OPT-IN for constrained hosts, not the default: capping saved only a
  // sub-ms blit per frame, and the panel shipped at 10 Hz once precisely
  // because a low rate was invisible while the guest was slow. The measured
  // fps sits in the stats line so this path can never silently regress.
  const hz30box = document.getElementById('hz30box');
  let lastAcceptMs = 0;
  let fpsCount = 0, fpsWindowStart = 0, fpsShown = 0;
  let blitMsEwma = null;         // measured cost of one accepted frame

  function paint() {
    if (!displayBroken) requestAnimationFrame(paint);
    if (!moduleRef || !runtimeReady || displayBroken) return;

    // -8: don't let a 33.4 ms rAF beat miss a 33.3 ms cap forever.
    if (hz30box.checked &&
        performance.now() - lastAcceptMs < 1000 / 30 - 8) return;

    if (infoBase < 0) {
      const fn = moduleProp('_wasm_display_info_addr');
      if (typeof fn !== 'function') return;       // runtime not up yet
      infoBase = fn() >>> 2;
      line(`display info struct at 0x${(infoBase << 2).toString(16)}`);
    }

    const u32 = moduleProp('HEAPU32');
    if (!u32) return;
    const info = readDisplayInfo(u32);
    if (!info || info.seq === lastSeq || !info.width || !info.height) return;
    lastSeq = info.seq;

    // Bounds-check before making a view: a bad pointer must fail here, loudly,
    // rather than throw once per animation frame from inside the blit.
    const bytes = info.stride * info.height;
    if (info.ptr <= 0 || (info.ptr & 3) ||
        info.ptr + bytes > u32.byteLength) {
      state(`display: implausible surface ptr=${info.ptr} bytes=${bytes}`, 'fail');
      infoBase = -1;
      return;
    }

    if (!imageData || imageData.width !== info.width ||
        imageData.height !== info.height) {
      canvas.width = info.width;
      canvas.height = info.height;
      canvas.style.width = `${info.width}px`;
      canvas.style.height = `${info.height}px`;
      imageData = ctx.createImageData(info.width, info.height);
      imageWords = new Uint32Array(imageData.data.buffer);
    }

    // Timed so the '30 Hz cap saves CPU' claim is a NUMBER, not a hope:
    // the cap's whole saving is (offers-accepts) × this cost per second.
    const blitT0 = performance.now();
    const nonBlack = blit(u32, info.ptr >>> 2, info.stride >>> 2,
                          info.width, info.height);
    if (PAINT) ctx.putImageData(imageData, 0, 0);
    blitMsEwma = blitMsEwma === null ? (performance.now() - blitT0)
               : blitMsEwma * 0.9 + (performance.now() - blitT0) * 0.1;
    Atomics.store(u32, infoBase + 10, info.seq);   // ack: painted through seq

    frames++;
    if (frames === 1) mark('first pixels');

    // Measured ACCEPTED frames over a rolling ~1 s window. This is the
    // number the refresh cap promises; showing it is what keeps the promise.
    const nowMs = performance.now();
    lastAcceptMs = nowMs;
    fpsCount++;
    if (nowMs - fpsWindowStart >= 1000) {
      fpsShown = fpsCount * 1000 / (nowMs - fpsWindowStart);
      fpsCount = 0;
      fpsWindowStart = nowMs;
    }

    const pct = (100 * nonBlack / (info.width * info.height)).toFixed(1);
    nonBlackPct = Number(pct);
    fbstatEl.textContent =
      `panel: ${info.width}x${info.height} · ${frames} frames · ${pct}% `
      + `non-black · ${fpsShown.toFixed(1)} fps `
      + `(${hz30box.checked ? 'cap 30 Hz' : 'vsync'}) `
      + `· blit ${blitMsEwma === null ? '—' : blitMsEwma.toFixed(2)} ms`;
    // The native oracle renders 59.0% non-black at 1.0's home screen.
    if (nonBlackPct > 40) mark('home screen (>40% non-black)');
  }
  requestAnimationFrame(paint);

  // --------------------------------------------------------------- input ---
  //
  // Everything below only ever writes into ui/wasm.c's ring buffer; a QEMU
  // timer on the emulator thread drains it and does the actual dispatch.
  // Calling QEMU's input API straight from here would touch a queue owned by
  // another thread, without the BQL.
  // Off by default: the shift is what the hardware did, and seeing it is part
  // of what this page shows. Deliberately NOT applied to ?tap= / ?sweep=, which
  // exist to measure the raw path -- correcting those would measure the
  // correction.
  // BUILDS is declared further down, so this reads it LAZILY -- at pointer
  // time, never at module-evaluation time, which would hit the temporal dead
  // zone and abort the whole script before touch is ever wired up.
  const tipBox = document.getElementById('tipfixbox');
  function tipOffset(y) {
    if (!tipBox || !tipBox.checked) return 0;
    const t = BUILDS[BUILD].tip;
    return Math.round(t.a + t.b * y);
  }

  function sendTouch(ev, down) {
    if (!moduleRef || !runtimeReady) return;
    const r = canvas.getBoundingClientRect();
    const x = Math.round((ev.clientX - r.left) / r.width * canvas.width);
    const y = Math.round((ev.clientY - r.top) / r.height * canvas.height);
    if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;
    // Clamped, not wrapped: near the bottom edge the corrected point would
    // otherwise fall off the panel and the guest would see nothing at all.
    const cy = Math.min(canvas.height - 1, Math.max(0, y + tipOffset(y)));
    moduleRef._wasm_input_touch(x, cy, down ? 1 : 0);
  }

  // A press has to stay down long enough for the GUEST to observe it, and
  // guest time runs far slower than wall clock in the browser: at the speeds
  // measured here an 800 ms wall-clock hold was ~1.5 s of guest time, so a
  // normal 100 ms tap collapses into a single guest instant and the down/up
  // pair is dispatched back-to-back with nothing in between. SpringBoard then
  // sees no touch at all -- which is exactly how a real click on an icon
  // behaved before this: [TOUCH] mouse DOWN and mouse UP at the same guest
  // timestamp, and no app launch.
  //
  // So releases are floored to this. It is a browser-speed workaround, not a
  // device fidelity question, and it should shrink as the engine gets faster.
  // How long a press is held, in WALL milliseconds.
  //
  // Guest time runs at ~2% of wall time, so a normal 100 ms tap is a few guest
  // milliseconds -- less than the multitouch model's own motion report interval
  // (MT_MOTION_REPORT_HZ = 60, i.e. 16.7 ms of guest time) -- and the guest
  // logs [TOUCH] mouse DOWN and mouse UP at the SAME guest timestamp, having
  // never observed a finger.
  //
  // Measured, at a target position that works: launches at 450 and 500 ms
  // (3/3), not at 30 ms (0/1). So the threshold is in (30, 450] ms and 800 ms
  // clears it with margin for the ~2x run-to-run spread in engine speed.
  //
  // Narrowing it needs a ladder that keeps the TARGET FIXED. ?sweep=1 gives
  // each rung a different icon, which kept failures repeatable but confounded
  // two variables: icon row 1 on 1.0 never registers at any hold (see
  // TOUCH_INVESTIGATION.md), and that alone produced two confident wrong
  // conclusions before a descending ladder broke the tie. The story is in
  // BROWSER_WASM_STATUS.md.
  //
  // WHY a hold is needed at all: guest time runs at ~2% of wall time, so a
  // normal ~100 ms tap is a few guest milliseconds -- less than the multitouch
  // model's own motion report interval (MT_MOTION_REPORT_HZ = 60, i.e. 16.7 ms
  // of guest time) -- and the guest never observes a finger.
  //
  // SHRINK THIS as the engine gets faster; re-run the sweep rather than
  // guessing. Do not express it in guest milliseconds: with -icount, QEMU warps
  // virtual time forward whenever the CPU idles, so guestRatio measured on an
  // idle home screen is not a usable conversion factor. That was tried and it
  // produced 4 ms guest -> 10 ms wall alongside 256 ms guest -> 4113 ms wall.
  const MIN_PRESS_MS = 800;

  function pressWallMs() { return MIN_PRESS_MS; }

  // ------------------------------------------- occlusion & tap-point viz ---
  //
  // Purely visual: nothing below changes what is injected into the guest.
  // The finger is positioned so the pointer sits just inside the fingertip;
  // the pad then covers the UI below and beside it, the way a real finger hid
  // what it touched. The blue dot marks where iPhone OS computes the tap:
  // ABOVE the click by the measured shift (its own finger compensation, plus
  // on 1.0 the open scale question), so computed = injected - shift(injected).
  // With the correction checkbox on, injected = click + shift, and the dot
  // lands back on the click -- which is the whole demonstration.
  const fingerEl = document.getElementById('finger');
  const fingerBox = document.getElementById('fingerbox');
  const tapdotBox = document.getElementById('tapdotbox');
  const panelwrap = document.getElementById('panelwrap');
  function shiftAt(y) {           // measured shift, in panel px, at panel y
    const t = BUILDS[BUILD].tip;
    return t.a + t.b * y;
  }
  function canvasPos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / r.width * canvas.width,
             y: (ev.clientY - r.top) / r.height * canvas.height };
  }
  fingerBox.addEventListener('change', () => {
    canvas.style.cursor = fingerBox.checked ? 'none' : 'pointer';
    if (!fingerBox.checked) fingerEl.style.display = 'none';
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!fingerBox.checked) return;
    const p = canvasPos(e);
    fingerEl.style.display = 'block';
    // Fingertip leading edge ~6 px above the pointer, pad centred on it.
    fingerEl.style.transform =
      `translate(${(p.x - 48).toFixed(1)}px, ${(p.y - 6).toFixed(1)}px)`;
  });
  canvas.addEventListener('pointerleave', () => {
    fingerEl.style.display = 'none';
  });
  function showTapPoint(x, y) {
    if (!tapdotBox.checked) return;
    const injectedY = y + tipOffset(y);
    const osY = injectedY - shiftAt(injectedY);
    for (const [cls, px, py] of [['clickmark', x, y], ['tapdot', x, osY]]) {
      const d = document.createElement('div');
      d.className = cls;
      d.style.left = `${px}px`;
      d.style.top = `${py}px`;
      panelwrap.appendChild(d);
      requestAnimationFrame(() => { d.style.opacity = '0'; });
      setTimeout(() => d.remove(), 1600);
    }
  }

  let touching = false;
  let pressStart = 0;
  canvas.addEventListener('pointerdown', (e) => {
    // Throws for a pointer id with no active pointer (synthetic events), and
    // an exception here would abort the handler before the touch is ever sent.
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    { const p = canvasPos(e); showTapPoint(p.x, p.y); }
    touching = true;
    pressStart = performance.now();
    sendTouch(e, true);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (touching) sendTouch(e, true);
  });
  const endTouch = (e) => {
    if (!touching) return;
    touching = false;
    const held = performance.now() - pressStart;
    const need = pressWallMs();
    if (held >= need) {
      sendTouch(e, false);
    } else {
      setTimeout(() => sendTouch(e, false), need - held);
    }
  };
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);
  // A pointer released outside the window never delivers pointerup; without
  // this the guest keeps a finger down forever.
  addEventListener('blur', () => {
    if (touching && moduleRef && runtimeReady) {
      touching = false;
      moduleRef._wasm_input_touch(0, 0, 0);
    }
  });

  const BUTTON_HOME = 0, BUTTON_POWER = 1;
  function pressButton(which) {
    if (!moduleRef || !runtimeReady) return;
    // The guest's key handler translates make/break itself, so a tap is a
    // down/up pair rather than a level held for as long as the mouse is.
    // Same hold reasoning as touch: verified in the browser as
    // "[BTN] keycode=25 ... [PMU] ONKEY pressed" followed 1.5 s of GUEST time
    // later by keycode=153 and ONKEY released.
    moduleRef._wasm_input_button(which, 1);
    setTimeout(() => moduleRef._wasm_input_button(which, 0), pressWallMs());
  }
  document.getElementById('home').onclick = () => pressButton(BUTTON_HOME);
  document.getElementById('power').onclick = () => pressButton(BUTTON_POWER);
  addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'h' || e.key === 'H') pressButton(BUTTON_HOME);
    if (e.key === 'p' || e.key === 'P') pressButton(BUTTON_POWER);
  });

  // ---------------------------------------------------------- press sweep ---
  //
  // ?sweep=1 DERIVES the press hold instead of taking it on faith. A headless
  // page cannot be driven from outside, so it drives itself.
  //
  // The ladder is in WALL milliseconds, because that is what the constant IS.
  // An earlier version swept GUEST milliseconds and converted through
  // guestRatio; it produced nonsense (4 ms guest -> 10 ms wall, 256 ms ->
  // 4113 ms) because with -icount QEMU WARPS VIRTUAL TIME FORWARD whenever the
  // CPU idles, and an idle home screen is exactly where the sweep runs. The
  // ratio is worth reporting; it is not worth steering by.
  //
  // Holds ascend and each rung taps a DIFFERENT icon. That ordering is what
  // fits a sweep into one boot: a hold too short to register leaves SpringBoard
  // where it was, so failures are free and repeatable, while the FIRST success
  // launches an app and ends the run -- and on 1.0 there is no way back out of
  // an app anyway (the known Home event-routing bug).
  //
  // The whole ladder MUST finish inside the auto-lock window. The guest locks
  // after roughly 260 s of idle and then every tap lands on a dead panel and
  // reads as a failure -- which is precisely how the first sweep invalidated
  // itself, five rungs at a stretch.
  const SWEEP_WALL_MS = (new URLSearchParams(location.search).get('rungs')
    || '30,60,120,250,500').split(',').map(Number);
  const SWEEP_SETTLE_MS = 25000;
  // 4x4 grid, panel coordinates, verified against a real click: the Settings
  // icon at (274, 248) logged [TOUCH] mouse DOWN at (0.856, 0.481).
  //
  // ROW 1 (y=67) IS DELIBERATELY ABSENT. Taps there never register on 1.0 at
  // any hold -- 0 of 10 attempts, 30 to 800 ms -- which is an open device-model
  // question (TOUCH_INVESTIGATION.md), and including it made every ladder's
  // first four rungs unfalsifiable. Rows 2 and 3 are verified to launch apps.
  const SWEEP_TARGETS = [
    [45, 157], [121, 157], [197, 157], [274, 157],
    [45, 249], [121, 249], [197, 249], [274, 249],
  ];

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function tapWall(px, py, wallMs) {
    moduleRef._wasm_input_touch(px, py, 1);
    setTimeout(() => moduleRef._wasm_input_touch(px, py, 0), wallMs);
  }

  // ?sweep=real verifies MIN_PRESS_MS through the REAL input path rather than
  // the sweep's own shortcut. It dispatches a normal fast click -- pointerdown
  // and a pointerup 50 ms later -- and leaves endTouch() to floor the release
  // at MIN_PRESS_MS. That is what a user actually does, and it exercises
  // sendTouch(), the coordinate mapping and the setPointerCapture try/catch
  // that a direct _wasm_input_touch() call all skip.
  //
  // One trial per boot: a success launches an app and on 1.0 there is no way
  // back to SpringBoard.
  function clickLikeAUser(px, py) {
    const r = canvas.getBoundingClientRect();
    const opts = { pointerId: 1, bubbles: true, cancelable: true,
                   clientX: r.left + px, clientY: r.top + py,
                   isPrimary: true, pointerType: 'mouse' };
    canvas.dispatchEvent(new PointerEvent('pointerdown', opts));
    setTimeout(() => canvas.dispatchEvent(new PointerEvent('pointerup', opts)),
               50);
  }

  // Wait for the GUEST to say it will accept touch. Waiting a fixed wall time
  // instead is what invalidated the first two press sweeps: the gate armed
  // around rung 5 in both, so both reported "the 5th hold worked" when what
  // actually happened was "the gate opened".
  async function awaitTouchGate() {
    while (nonBlackPct < 40) await sleep(2000);
    // On a RESUMED snapshot the gate is already armed -- lcd->input_ready is
    // migrated -- so the model never re-prints "[LCD] Touch input ready" and
    // waiting for it would hang for ever. A live panel plus a bounded wait is
    // the right condition: on a cold boot the message always arrives well
    // inside it, and on a resume its absence means "already open", not "shut".
    const deadline = performance.now() + 60000;
    while (!touchReady && performance.now() < deadline) await sleep(2000);
    console.log(touchReady
      ? `[sweep] touch gate armed at ${at()}s`
      : `[sweep] no gate message (resumed snapshot?); panel live, proceeding`);
    await sleep(5000);
  }

  async function runVerify() {
    await awaitTouchGate();
    const baseline = nonBlackPct;
    const [px, py] = SWEEP_TARGETS[0];
    console.log(`[verify] MIN_PRESS_MS=${MIN_PRESS_MS} baseline=${baseline}%`
                + ` ratio=${guestRatio.toFixed(4)} -- fast 50ms click at (${px},${py})`);
    clickLikeAUser(px, py);
    await sleep(SWEEP_SETTLE_MS);
    const launched = nonBlackPct > 80;
    const asleep = nonBlackPct < 5;
    sweepResult = { mode: 'verify', minPressMs: MIN_PRESS_MS, baseline,
                    ratioAtStart: Number(guestRatio.toFixed(4)),
                    nonBlackPct, launched, invalid: asleep || null };
    report(true);
    console.log(`[verify] nonBlack=${nonBlackPct}% launched=${launched}`
                + `${asleep ? ' PANEL ASLEEP - INVALID' : ''}`);
  }

  // ?sweep=calc — the APP-LAUNCH benchmark: tap the Calculator icon and time
  // tap → "digit display visible". This is the number a user feels; boot
  // landmarks cannot see it (the 16-bit jmp-cache experiment moved a boot
  // 10% without anyone knowing what it did to launches). Icon coordinate
  // (122,247) and the readiness oracle are MEASURED values lifted from
  // scripts/calc-touch-map.py: mean red of the display strip rows 60–100,
  // cols 40–280 reads ~102 on the home screen and ~149 in Calculator;
  // threshold 125. Reports wall seconds AND guest seconds — under -icount
  // those are different quantities and both matter (wall = felt latency,
  // guest = how much work 1.0 actually does to launch).
  async function runCalcBench() {
    await awaitTouchGate();
    // 1.0 swallows the first press after the gate arms (documented in
    // IN_APP_BUTTON_INVESTIGATION.md). Prime with a throwaway tap on empty
    // wallpaper, then the real one. First run without this: tap swallowed,
    // nothing launched, guest idle-warped to auto-lock, poll froze on a
    // dark panel for 400 s.
    tapWall(160, 180, MIN_PRESS_MS);
    await sleep(3000);
    const t0 = performance.now();
    const g0 = guestMs();   // the page's own helper -- u32 is closure-scoped
    console.log('[calcbench] tapping Calculator icon (122,247)');
    tapWall(122, 247, MIN_PRESS_MS);
    let ready = false, dt = 0;
    for (;;) {
      await sleep(250);
      dt = (performance.now() - t0) / 1000;
      let sum = 0, n = 0;
      for (let y = 60; y < 100; y += 4) {
        for (let x = 40; x < 280; x += 4) {
          sum += imageData.data[(y * 320 + x) * 4];
          n++;
        }
      }
      if (sum / n > 125) { ready = true; break; }
      // Panel off (auto-lock) freezes frames and the strip forever: abort
      // with a reason instead of polling a dead image to the timeout.
      if (nonBlackPct < 5) {
        console.log('[calcbench] ABORT: panel went dark (auto-lock?) at '
                    + dt.toFixed(1) + ' s');
        break;
      }
      if (dt > 600) break;
    }
    const gs = (guestMs() - g0) / 1000;
    const msg = `[calcbench] tap->ready: `
      + `${ready ? dt.toFixed(1) + ' s wall' : 'TIMEOUT'} `
      + `(${gs.toFixed(1)} s guest)`;
    console.log(msg);
    line(msg);
    sweepResult = { mode: 'calcbench', build: BUILD,
                    wall_s: ready ? +dt.toFixed(1) : null,
                    guest_s: +gs.toFixed(1), ready };
    report(true);
  }

  // ?tap=x,y taps ONE panel coordinate after the guest's input gate arms, and
  // reports whether the screen changed. Exists because the sweep deliberately
  // excludes icon row 1, which is the coordinate under investigation.
  async function runSingleTap(spec) {
    const [px, py] = spec.split(',').map(Number);
    await awaitTouchGate();
    const before = nonBlackPct;
    console.log(`[tap] ${BUILD} at (${px},${py}) baseline=${before}%`);
    tapWall(px, py, MIN_PRESS_MS);
    for (let i = 0; i < 24; i++) {
      await sleep(5000);
      if (nonBlackPct > 80) break;
    }
    const launched = nonBlackPct > 80;
    sweepResult = { mode: 'tap', build: BUILD, tap: spec, before,
                    after: nonBlackPct, launched };
    report(true);
    console.log(`[tap] ${BUILD} (${px},${py}) -> ${nonBlackPct}% `
                + `launched=${launched}`);
  }

  async function runSweep() {
    await awaitTouchGate();
    const baseline = nonBlackPct;
    const ratioAtStart = guestRatio;
    console.log(`[sweep] start baseline=${baseline}% ratio=${ratioAtStart.toFixed(4)}`);

    const trials = [];
    for (let i = 0; i < SWEEP_WALL_MS.length; i++) {
      const wallMs = SWEEP_WALL_MS[i];
      const [px, py] = SWEEP_TARGETS[i % SWEEP_TARGETS.length];
      tapWall(px, py, wallMs);
      console.log(`[sweep] rung ${wallMs}ms wall at (${px},${py})`);
      await sleep(SWEEP_SETTLE_MS);
      const launched = nonBlackPct > 80;
      // A panel that has gone black means the guest auto-locked and every
      // remaining rung would read as a spurious failure. Say so and stop
      // rather than reporting a threshold the run did not establish.
      const asleep = nonBlackPct < 5;
      trials.push({ wallMs, nonBlackPct, launched, asleep });
      console.log(`[sweep] rung ${wallMs}ms -> nonBlack=${nonBlackPct}%`
                  + ` launched=${launched}${asleep ? ' PANEL ASLEEP' : ''}`);
      sweepResult = { baseline, ratioAtStart: Number(ratioAtStart.toFixed(4)),
                      trials, threshold: launched ? wallMs : null,
                      invalid: asleep || null };
      report(true);
      if (asleep) { console.log('[sweep] INVALID: panel asleep'); return; }
      if (launched) { console.log(`[sweep] THRESHOLD ${wallMs}ms wall`); return; }
    }
    console.log('[sweep] no rung registered up to '
                + SWEEP_WALL_MS[SWEEP_WALL_MS.length - 1] + 'ms');
  }
  // ?sweep=home checks the thing the MBX fix (e79971b5e9) was for: on 1.0,
  // pressing Home from INSIDE an app used to do nothing. SpringBoard was
  // spinning on an AppleMBX register bit our stub never set, so it stopped
  // delivering events after the first press. This drives the whole round trip
  // -- launch an app, press Home, come back -- from the page, so the engine fix
  // is verified in the browser rather than assumed to carry over.
  async function runHomeCheck() {
    await awaitTouchGate();
    const home = nonBlackPct;
    const [px, py] = SWEEP_TARGETS[0];
    console.log(`[home] baseline=${home}% -- launching an app at (${px},${py})`);
    tapWall(px, py, MIN_PRESS_MS);

    // Wait for the app to fill the panel. The home screen sits at ~45% and an
    // app at ~96-99%, so this is unambiguous.
    let launched = false;
    for (let i = 0; i < 20 && !launched; i++) {
      await sleep(5000);
      launched = nonBlackPct > 80;
    }
    console.log(`[home] launched=${launched} nonBlack=${nonBlackPct}%`);
    if (!launched) {
      sweepResult = { mode: 'home', launched: false, invalid: 'app never launched' };
      report(true);
      return;
    }
    const inApp = nonBlackPct;

    console.log('[home] pressing Home from inside the app');
    pressButton(BUTTON_HOME);
    let returned = false;
    for (let i = 0; i < 20 && !returned; i++) {
      await sleep(5000);
      // Back on SpringBoard: away from the app's ~96-99% and near the home
      // screen's ~45%. A blank panel (<5%) would mean it slept, not returned.
      returned = nonBlackPct > 5 && nonBlackPct < 70;
    }
    sweepResult = { mode: 'home', launched: true, inAppPct: inApp,
                    afterHomePct: nonBlackPct, returned };
    report(true);
    console.log(`[home] RESULT returned=${returned} `
                + `home=${home}% inApp=${inApp}% after=${nonBlackPct}%`);
  }

  let sweepResult = null;
  const SWEEP_MODE = new URLSearchParams(location.search).get('sweep');

  // Which firmware. The three artifacts below are per-build and the security
  // EPOCH is firmware-keyed, not board-keyed: booting one build's NAND against
  // another's epoch wedges iBoot with an EMPTY serial log, which looks exactly
  // like a hang. So they travel together, in one table, and ?build= picks a row.
  //
  // `tip` is the measured vertical error, as shift(y) = a + b*y in PANEL
  // PIXELS -- how far BELOW the drawn control its hit box actually sits, i.e.
  // how far ABOVE your cursor the guest receives the point. Adding it back to
  // the injected y makes a click land where the pointer is. Both rows come
  // from scripts/calc-touch-map.py; see TOUCH_INVESTIGATION.md.
  //
  // The two builds are NOT the same kind of number:
  //   4A102  b ~ 0        a pure constant, and it is entirely iPhone OS's own
  //                       finger projection (SBFingerProjection = 3.5 points
  //                       = 1.2347 mm = 7.90 px) plus that build's hit-box
  //                       asymmetry. Nothing here is broken.
  //   1A543a b = -0.0527  a SCALE, largest at the top of the panel. Only ~7.6
  //                       of it is the finger projection; the rest is a real
  //                       defect in this emulator's sensor geometry, which the
  //                       checkbox therefore HIDES rather than fixes.
  const BUILDS = {
    '1A543a': { epoch: 0, label: 'iPhone OS 1.0',
                tip: { a: 32.91, b: -0.0527 } },
    '4A102':  { epoch: 3, label: 'iPhone OS 1.1.4',
                tip: { a: 9.64,  b: 0.0070 } },
  };
  const BUILD = new URLSearchParams(location.search).get('build') || '1A543a';
  if (!BUILDS[BUILD]) {
    throw new Error(`unknown build ${BUILD}; have ${Object.keys(BUILDS)}`);
  }
  const EPOCH = BUILDS[BUILD].epoch;
  document.querySelector('h1').textContent =
    `${BUILDS[BUILD].label} (${BUILD}) — WebAssembly JIT`;
  {
    const t = BUILDS[BUILD].tip;
    const top = Math.round(t.a), bot = Math.round(t.a + t.b * 480);
    document.getElementById('tipfixlabel').textContent =
      `correct finger offset (${top === bot ? `${top}` : `${bot}\u2013${top}`} px)`;
  }

  const RESUME = new URLSearchParams(location.search).get('resume') === '1';

  // ------------------------------------------------------- persistence ---
  //
  // W6. Guest NAND writes live in a copy-on-write overlay in the emulator's
  // heap and evaporate with the tab, so the device forgets everything between
  // visits. This carries the overlay to IndexedDB and back.
  //
  // Keyed to the NAND PACK, not to the engine build. That is the whole reason
  // persistence is not done with a VM snapshot: a snapshot is invalidated by
  // any device gaining a VMStateDescription, so every emulator update would
  // discard the user's state -- and it would not work anyway, because the
  // overlay has no vmstate and a snapshot does not capture NAND writes at all.
  const OVERLAY_DB = 'iphone-os-overlay';
  const OVERLAY_KEY = `${BUILD}/overlay`;

  function idb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(OVERLAY_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore('overlay');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function overlayLoad() {
    try {
      const db = await idb();
      return await new Promise((resolve, reject) => {
        const r = db.transaction('overlay').objectStore('overlay').get(OVERLAY_KEY);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => reject(r.error);
      });
    } catch (e) {
      line(`overlay: could not read saved state (${e})`, 'err');
      return null;
    }
  }

  async function overlayStore(bytes) {
    const db = await idb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('overlay', 'readwrite');
      tx.objectStore('overlay').put(bytes, OVERLAY_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }

  // Ask the emulator thread for the overlay and wait for it to publish. The
  // serialization happens on ITS thread -- the table is live and the page must
  // not walk it.
  let saveInFlight = false;
  async function saveOverlay(reason) {
    if (saveInFlight || !moduleRef || !runtimeReady) return;
    if (!moduleRef._wasm_request_overlay_save) return;
    saveInFlight = true;
    try {
      moduleRef._wasm_request_overlay_save();
      let size = 0;
      for (let i = 0; i < 60 && !size; i++) {
        await sleep(100);
        size = moduleRef._wasm_overlay_size();
      }
      if (!size) { line('overlay: nothing to save yet'); return; }
      const addr = Number(moduleRef._wasm_overlay_addr());
      // Copy out of shared memory before releasing it, and copy rather than
      // view: structuredClone into IndexedDB refuses a SharedArrayBuffer view.
      const bytes = new Uint8Array(moduleRef.HEAPU8.slice(addr, addr + size));
      moduleRef._wasm_overlay_release();
      await overlayStore(bytes);
      const pages = (size - 16) / (4 + 2112);
      line(`overlay saved: ${pages} pages, `
           + `${(size / 1048576).toFixed(1)} MiB (${reason})`);
      console.log(`[bench] overlay saved: ${pages} pages (${reason})`);
    } catch (e) {
      line(`overlay save failed: ${e}`, 'err');
    } finally {
      saveInFlight = false;
    }
  }

  // Save when the tab goes away. pagehide/visibilitychange are the only events
  // that reliably fire on mobile; unload does not.
  addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveOverlay('hidden');
  });
  addEventListener('pagehide', () => saveOverlay('pagehide'));
  globalThis.__saveOverlay = () => saveOverlay('manual');

  // ---------------------------------------------------------------- boot ---
  import { registerChunkWorker, loadManifest, stageChunkedNand,
           prefetchBootSet, startChunkFetcher, chunkStats }
    from '../../src/emulator/chunk-loader.js';

  let lastRunState = null;

  const { default: Module } = await import('./qemu-system-arm.js');

  // Only the small artifacts are still fetched whole; the NAND arrives as
  // chunks, on demand, through the service worker.
  // Per-build, for the same reason the epoch is: an iBoot and a NOR from
  // different firmwares do not mix. `bootrom` is shared across builds.
  const FILES = [
    ['/fw/bootrom', 'bootrom'],
    ['/fw/iboot.bin', `fw/${BUILD}/iboot.bin`],
    ['/fw/nor.bin', `fw/${BUILD}/nor.bin`],
  ];

  // The service worker has to be CONTROLLING the page before the first chunk
  // request, or those requests bypass the cache entirely.
  state('registering the chunk worker…');
  await registerChunkWorker('/sw.js');
  const manifest = await loadManifest(`/chunked/${BUILD}/`);
  line(`chunk manifest: ${manifest.hashes.length} chunks, `
       + `${manifest.prefetch.length} in the boot set`);

  await Module({
    arguments: [
      // epoch 0 is 1.0's; -icount shift=1 presents ~500 MHz, close to the real
      // 412 MHz S5L8900. Without it the guest takes timeout paths and panics.
      '-M', 'iPhone-2G,bootrom=/fw/bootrom,iboot=/fw/iboot.bin,' +
            `nand=/fw/nand,epoch=${EPOCH}`,
      '-m', '1G',
      '-pflash', '/fw/nor.bin',
      // ?display=none is the A/B control for the display path: serial
      // landmarks (iBoot/kernel/BSD/launchd) still work, the panel ones do
      // not. NOTE -display none also never starts the wasm input/drain timer,
      // so ?resume=1 and touch DO NOT work with it -- measurement only.
      '-display',
      new URLSearchParams(location.search).get('display') === 'none'
        ? 'none' : 'wasm',
      // NOT -serial stdio. In a browser the guest's stdout never reaches
      // Module.print (it does under Node), so a run looks silent even while it
      // is booting normally -- device-model stderr still arrives, which makes
      // it especially misleading. Write to a MEMFS file and poll it instead.
      '-serial', 'file:/fw/serial.log',
      '-icount', 'shift=1',
      ...(RESUME ? ['-incoming', 'file:/fw/state'] : []),
    ],
    onRuntimeInitialized: () => {
      runtimeReady = true;
      line('runtime initialized; painting enabled');
      console.log('[bench] runtime initialized');

      // THE PAGE owns the fetch worker, not the emulator's thread. A nested
      // dedicated worker is serviced through its parent's context, and that
      // parent is precisely the thread blocked in Atomics.wait waiting for the
      // chunk -- so the fetch never completes. Measured: 10 s timeout when
      // nested, 5 ms when the page owns it.
      if (RESUME) {
        // -incoming leaves the machine PAUSED and the page has no QMP monitor,
        // so ask the emulator thread to start it. ui/wasm.c services the request
        // from its drain timer, under the BQL, and waits for RUN_STATE_PAUSED --
        // which is precisely the "the incoming stream has finished loading"
        // signal, since the runstate is INMIGRATE until then.
        moduleRef._wasm_request_resume();
        line('resume requested; waiting for the snapshot to load');
        const poll = setInterval(() => {
          let st = 0;
          try { st = moduleRef._wasm_run_state(); } catch (e) { return; }
          // RunState indices are not stable across QEMU versions, so ask the
          // emulator for the NAME rather than keeping a copy of the enum here.
          let name = String(st);
          try {
            const h = moduleRef.HEAPU8;
            let a = Number(moduleRef._wasm_run_state_name());
            let end = a;
            while (h[end]) end++;
            name = new TextDecoder().decode(h.subarray(a, end));
          } catch (e) { /* keep the number */ }
          if (name !== lastRunState) {
            lastRunState = name;
            line(`runstate: ${name}`);
            console.log(`[bench] runstate: ${name}`);
          }
          if (name === 'running') {
            clearInterval(poll);
            mark('snapshot resumed');
            state('resumed from snapshot', 'ok');
          } else {
            state(`snapshot: ${name}…`);
          }
        }, 500);
      }

      startChunkFetcher(moduleRef, {
        script: manifest.fetcher || '/chunk-fetch-worker.js',
        onError: (m) => {
          line(`chunk fetch failed: ${m.url} — ${m.message}`, 'err');
          console.warn('[bench] chunk fetch failed', m.url, m.message);
        },
      }).then(() => line('chunk fetcher running'))
        .catch((e) => {
          state(`chunk fetcher: ${e.message}`, 'fail');
          line(`chunk fetcher: ${e.message}`, 'err');
        });

      if (SWEEP_MODE === '1') runSweep();
      else if (SWEEP_MODE === 'real') runVerify();
      else if (SWEEP_MODE === 'home') runHomeCheck();
      else if (SWEEP_MODE === 'calc') runCalcBench();
      const tapSpec = new URLSearchParams(location.search).get('tap');
      if (tapSpec) runSingleTap(tapSpec);
    },
    preRun: [async (mod) => {
      // An ASYNC preRun is NOT awaited by Emscripten: `run()` proceeds at the
      // first await, so every fetch below races `main()`. That race is won or
      // lost by how long wasm compilation takes -- a COLD load compiles slowly
      // and staging wins; a warm one starts in ~0.7 s and staging loses, and
      // `-incoming file:/fw/state` then dies with "No such file or directory"
      // and status 1, leaving a permanently black panel on the SECOND visit.
      // A run dependency is the documented way to hold `main()` back.
      mod.addRunDependency('stage-assets');
      try {
      // preRun runs on the MAIN thread, so this is the Module whose exports
      // and HEAP views address the shared memory from here.
      moduleRef = mod;
      fsRef = mod.FS;
      globalThis.__mod = mod;        // for poking at the module from the console
      mod.FS.mkdir('/fw');
      // ?qsp=1: QEMU's sync profiler, reported to the log every 10 s.
      // Answers "which lock, from which callsite" for the vCPU's futex
      // waits. A staged FILE, not ENV -- ENV is not an exported runtime
      // method in this build and touching it aborts the whole module.
      if (new URLSearchParams(location.search).get('qsp') === '1') {
        mod.FS.writeFile('/fw/qsp', '1');
      }

      let staged = 0;
      for (const [dst, src] of FILES) {
        state(`downloading ${src}…`);
        const data = new Uint8Array(await (await fetch(src)).arrayBuffer());
        mod.FS.writeFile(dst, data);
        staged += data.length;
        line(`staged ${src} (${(data.length / 1048576).toFixed(1)} MiB)`);
      }

      // The INDEX, not the pack: ~0.5 MiB instead of 215. This also creates
      // /fw/nand and its bank0..bank7 directories, which are NOT optional even
      // though nothing here is writable -- the model opens
      // <nand>/bank<N>/<page>_new.page on a guest page write and hw_error()s,
      // killing the emulator, if the directory is missing.
      state('staging the chunk index…');
      const idxBytes = await stageChunkedNand(mod.FS, manifest);
      line(`staged chunk index (${((idxBytes || 0) / 1048576).toFixed(2)} MiB)`);

      // Copy-on-write overlay in RAM. Without an overlay the boot stalls after
      // launchd for ever. The FILE-backed writable mode is worse here than
      // useless: under -sPROXY_TO_PTHREAD every MEMFS syscall is proxied to the
      // main thread, so the per-read stat() becomes a cross-thread round trip
      // and the boot stalls outright.
      mod.FS.writeFile('/fw/nand/nand-tune', 'overlay=ram\n');

      // Restore is just a file: the model reads <nand>/overlay.bin when it
      // enables the overlay, before the machine starts, so nothing has to cross
      // a thread boundary on the way in.
      const saved = await overlayLoad();
      if (saved) {
        mod.FS.writeFile('/fw/nand/overlay.bin', saved);
        line(`restoring ${((saved.length - 16) / (4 + 2112)) | 0} saved `
             + `NAND pages from a previous visit`);
      }

      if (RESUME) {
        // The whole stream has to be resident before the machine starts: the
        // incoming migration is read synchronously from MEMFS at startup, so
        // there is no opportunity to fault it in.
        state('downloading the snapshot…');
        const base = `snapshots/${BUILD}/`;

        // Prefer the Brotli'd stream: 11.5 MiB on the wire against 57.2 MiB
        // raw, decompressed by the BROWSER via Content-Encoding: br so nothing
        // here carries a decoder.
        //
        // But verify rather than assume. A host that serves .br WITHOUT the
        // header hands back compressed bytes that look like a perfectly good
        // response, and QEMU would then reject the migration stream as garbage
        // with nothing pointing at the cause. The provenance file records the
        // raw byte count, so a length mismatch is caught here and falls back to
        // the uncompressed stream.
        let meta = null;
        try {
          const m = await fetch(base + 'state-provenance.json');
          if (m.ok) meta = await m.json();
        } catch (e) { /* optional */ }

        let st = null;
        if (meta && meta.brotli_bytes) {
          const rb = await fetch(base + 'state.br');
          if (rb.ok) {
            const buf = new Uint8Array(await rb.arrayBuffer());
            if (buf.length === meta.bytes) {
              st = buf;
              line(`staged snapshot (${(meta.brotli_bytes / 1048576).toFixed(1)}`
                   + ` MiB on the wire, ${(buf.length / 1048576).toFixed(1)}`
                   + ` MiB decoded)`);
            } else {
              line(`state.br came back ${buf.length} B, expected `
                   + `${meta.bytes} B decoded — the server is not sending `
                   + 'Content-Encoding: br; using the raw stream', 'err');
            }
          }
        }

        if (!st) {
          const r = await fetch(base + 'state');
          if (!r.ok) {
            throw new Error(`no snapshot at ${base}state (${r.status}) — `
              + `build one with scripts/wasm/build-snapshot.py --build ${BUILD}`);
          }
          st = new Uint8Array(await r.arrayBuffer());
          line(`staged snapshot (${(st.length / 1048576).toFixed(1)} MiB, raw)`);
        }
        mod.FS.writeFile('/fw/state', st);
      }

      // Prefetch the recorded boot order, and AWAIT it: a demand-faulted chunk
      // costs the guest a full network round trip while it blocks.
      await prefetchBootSet(manifest, {
        onProgress: (m) => state(`prefetching chunks ${m.done}/${m.total}…`),
      });
      state(`booting — ${(staged / 1048576).toFixed(1)} MiB of images + `
            + `${manifest.prefetch.length} chunks prefetched`);
      } catch (e) {
        // Report it rather than releasing the gate on a half-staged FS, which
        // would reproduce exactly the black panel this dependency prevents.
        line(`staging failed: ${e.message}`, 'err');
        state('staging failed', 'err');
        throw e;
      }
      mod.removeRunDependency('stage-assets');
    }],
    print: (t) => { note(t); line(t); },
    printErr: (t) => {
      if (/unsupported syscall/.test(t)) return;
      note(t);
      line(t, 'err');
    },
  });
</script>
