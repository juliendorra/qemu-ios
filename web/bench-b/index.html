<!-- Session B's measurement harness: one page, two experiments.

     B1  JIT tuning. ?instantiate=50|100|300 (and ?max=<n>) is written into
         /fw/jit-tune, which tcg/wasm64.c reads at startup -- so a sweep is
         three page loads, not three 20-minute wasm rebuilds. The page shows
         the [JIT] counters (compiled/recompiled/evicted/live) next to the
         landmark times, because a landmark time without the counters cannot
         tell "compiled more" from "thrashed more".

     B2/B3  Chunked delivery. ?mode=chunked stages only the pack INDEX and
         lets the emulator demand-fault 130,944-byte chunks through the
         service worker; ?mode=pack stages the whole 215.6 MiB pack, which is
         the thing being replaced. The byte counter comes from the SERVER
         (/__chunk-stats), so the page cannot flatter itself.

     Serve with scripts/wasm/serve.py --port 8011 (COOP/COEP required) and
     open /bench-b/. Session A owns web/public/*; nothing here touches it. -->
<meta charset="utf-8">
<title>iPhone OS 1.0 — Session B bench</title>
<style>
  body { font: 13px ui-monospace, Menlo, monospace; margin: 0; padding: 1rem;
         background: #14161a; color: #d7dae0; }
  h1 { font-size: 14px; margin: 0 0 .75rem; color: #9aa4b2; font-weight: 600; }
  .card { padding: .5rem .75rem; border-radius: 4px; background: #22262e;
          margin-bottom: .5rem; white-space: pre; }
  #marks { background: #1b1f26; color: #8fd694; }
  #jit { background: #1b1f26; color: #d6c48f; }
  #net { background: #1b1f26; color: #8fb8d6; }
  .ok   { border-left: 3px solid #4ac26b; }
  .fail { border-left: 3px solid #e5534b; }
  #log { white-space: pre-wrap; line-height: 1.4; }
  .err { color: #e5a3a0; }
</style>
<h1>iPhone OS 1.0 (1A543a) — WebAssembly JIT bench</h1>
<div class="card" id="state">loading…</div>
<div class="card" id="marks">(no landmarks yet)</div>
<div class="card" id="jit">(no JIT stats yet)</div>
<div class="card" id="net">(no chunk stats yet)</div>
<div class="card" id="fb">(no framebuffer samples yet)</div>
<div id="log"></div>
<script type="module">
  import { registerChunkWorker, loadManifest, stageChunkedNand, prefetchBootSet,
           chunkStats, postToChunkWorker, startChunkFetcher }
    from '../src/emulator/chunk-loader.js';

  const params = new URLSearchParams(location.search);
  const INSTANTIATE = params.get('instantiate') || '100';
  const MAX_INSTANCES = params.get('max') || '48000';
  const MODE = params.get('mode') || 'pack';         // pack | chunked
  const CHUNK_BASE = params.get('chunks') || '/chunked/1A543a/';
  const PREFETCH = params.get('prefetch') !== '0';
  const COLD = params.get('cold') === '1';           // drop the chunk cache
  // Default ON, matching tcg/wasm64.c; ?adaptive=0 pins the static threshold.
  const ADAPTIVE = params.get('adaptive') !== '0';
  // Echoed back in every report so the server can reject posts from another
  // page -- Session A's page posts to the same endpoint.
  const LABEL = params.get('label') || 'bench-b';
  // Both are bisection handles: the home-screen run needs a display backend
  // and a writable NAND, and either could be what a stalled boot is stalling
  // on.
  const DISPLAY = params.get('display') || 'none';
  const WRITABLE = params.get('writable') !== '0';
  // Wait for the prefetch before starting the emulator. Default ON: booting
  // WHILE the service worker is still pulling 512 chunks froze the page in a
  // standalone Chrome every time (reports stopped ~7 s in, chunk requests kept
  // flowing) -- and it is the wrong shape anyway, since a demand-faulted chunk
  // stalls the guest for a whole round trip.
  const AWAIT_PREFETCH = params.get('awaitPrefetch') !== '0';
  // ?sw=0 takes the service worker out of the path entirely: the emulator's
  // synchronous XHRs go straight to the network (and the HTTP cache, which
  // the chunks' immutable Cache-Control makes usable). Diagnostic: it
  // separates "chunked delivery is broken" from "the service worker and a
  // synchronous XHR do not get along in this browser".
  const USE_SW = params.get('sw') !== '0';

  const logEl = document.getElementById('log');
  const stateEl = document.getElementById('state');
  const marksEl = document.getElementById('marks');
  const jitEl = document.getElementById('jit');
  const netEl = document.getElementById('net');
  const fbEl = document.getElementById('fb');
  const t0 = performance.now();
  const at = () => ((performance.now() - t0) / 1000).toFixed(1).padStart(7);

  // Serial landmarks only. SpringBoard NEVER announces itself, so the home
  // screen is detected from PIXELS below -- grepping serial for it has wasted
  // two sessions of other people's time.
  const LANDMARKS = [
    ['iBoot banner',   t => t.includes('BUILD_TAG')],
    ['kernel',         t => t.includes('Darwin Kernel Version')],
    ['BSD root',       t => t.includes('BSD root:')],
    ['launchd',        t => t.includes('BOOT_TIME')],
    ['first pixels',   () => false],     // set by the framebuffer poll
    ['home screen',    () => false],     // set by the framebuffer poll
  ];
  const hit = new Map();
  let fsRef = null;
  let fsModule = null;
  let serialSeen = 0;

  const renderMarks = () => {
    marksEl.textContent =
      `instantiate=${INSTANTIATE} max=${MAX_INSTANCES} mode=${MODE}` +
      `${ADAPTIVE ? ' adaptive' : ''}\n` +
      LANDMARKS.map(([name]) =>
        `${hit.has(name) ? hit.get(name).padStart(8) : '       —'}  ${name}`)
      .join('\n');
  };
  renderMarks();

  const state = (text, cls) => {
    stateEl.textContent = text;
    stateEl.className = `card ${cls || ''}`;
  };

  function line(text, cls) {
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.textContent = `[${at()}s] ${text}`;
    logEl.appendChild(el);
    if (logEl.childElementCount > 400) logEl.firstElementChild.remove();
  }

  // Latest [JIT] and [NANDCHUNK] counters, keyed by tag so the card shows the
  // current state rather than a scrolling history.
  const counters = new Map();

  function note(text) {
    const tag = text.startsWith('[JIT]') ? 'JIT'
              : text.startsWith('[NANDCHUNK]') ? 'NANDCHUNK' : null;
    if (tag) {
      counters.set(tag === 'JIT' && text.includes('tuning') ? 'tuning' : tag,
                   `${at()}s ${text}`);
      jitEl.textContent = [...counters.values()].join('\n');
      report();
    }
    // The framebuffer poll marks its own landmarks through these sentinels,
    // since they have no serial line to match.
    if (text === '__pixels' && !hit.has('first pixels')) {
      hit.set('first pixels', at());
      renderMarks();
      report(true);
      return;
    }
    if (text === '__home' && !hit.has('home screen')) {
      hit.set('home screen', at());
      renderMarks();
      state(`home screen: ${nonBlackPct.toFixed(1)}% non-black`, 'ok');
      report(true);
      return;
    }
    for (const [name, test] of LANDMARKS) {
      if (!hit.has(name) && test(text)) {
        hit.set(name, at());
        renderMarks();
        report(true);
        if (name === 'SpringBoard') state('SpringBoard reached', 'ok');
      }
    }
    if (/panic\(|kernel abort|hardware error/.test(text)) {
      state(`guest failure: ${text.slice(0, 120)}`, 'fail');
    }
  }

  // The emulator's chunk fetcher reports transport failures through
  // console.error (it runs on a worker, where fprintf does not reach the page's
  // printErr in time to be useful).
  const nativeConsoleError = console.error.bind(console);
  console.error = (...args) => {
    const text = args.join(' ');
    if (text.includes('[NANDCHUNK]')) {
      // Keyed apart from the C-side counter line, which shares the tag and
      // would otherwise overwrite the transport error in the report.
      counters.set('NANDCHUNK-JS', `${at()}s ${text}`);
      jitEl.textContent = [...counters.values()].join('\n');
      line(text, 'err');
      report(true);
    }
    nativeConsoleError(...args);
  };

  addEventListener('error', (e) => {
    state(`emulator failure: ${String(e.message).slice(0, 140)}`, 'fail');
    line(`window error: ${e.message}`, 'err');
    failure = String(e.message).slice(0, 200);
    report(true);
  });

  /*
   * Post the run's numbers to the server (scripts/wasm/serve.py --results),
   * so a sweep can be driven headlessly by scripts/wasm/bench-run.py and a run
   * killed on a timeout still leaves its landmarks behind. Rate-limited: the
   * counters arrive every 16 compiles, which is far more often than anyone
   * needs a snapshot.
   */
  let lastReport = 0;
  let failure = null;
  let reportFailures = 0;
  let lastReportError = null;
  function report(force) {
    const now = performance.now();
    if (!force && now - lastReport < 5000) return;
    lastReport = now;
    const body = JSON.stringify({
      instantiate: Number(INSTANTIATE), maxInstances: Number(MAX_INSTANCES),
      label: LABEL,
      mode: MODE, prefetch: PREFETCH, cold: COLD, adaptive: ADAPTIVE,
      elapsed: Number((now / 1000).toFixed(1)),
      landmarks: Object.fromEntries([...hit].map(([k, v]) => [k, Number(v)])),
      reportFailures, lastReportError,
      nonBlackPct: Number(nonBlackPct.toFixed(2)), frames, guestMs,
      counters: Object.fromEntries(counters),
      failure,
    });
    // NOT keepalive, and NOT sendBeacon. Both are capped at 64 KiB of
    // IN-FLIGHT bytes per origin, and in a cold run every request queues
    // behind the service worker's hundreds of chunk fetches -- so the quota
    // fills, every later report is rejected on the spot, and a perfectly
    // healthy run looks frozen. The rejection was being swallowed, which is
    // why it read as "the page's main thread stopped".
    fetch('/__bench-result', { method: 'POST', body })
      .catch((e) => { reportFailures++; lastReportError = String(e); });
  }
  setInterval(() => report(true), 15000);

  setInterval(() => {
    if (!fsRef) return;
    let data;
    try {
      data = fsRef.readFile('/fw/serial.log', { encoding: 'utf8' });
    } catch (e) { return; }
    if (data.length <= serialSeen) return;
    const fresh = data.slice(serialSeen);
    serialSeen = data.length;
    for (const text of fresh.split('\n')) {
      if (text.trim()) { note(text); line(text); }
    }
  }, 1000);

  // Server-side byte count: what actually crossed the wire, cold or warm.
  async function serverBytes() {
    try {
      const r = await fetch('/__chunk-stats', { cache: 'no-store' });
      return await r.json();
    } catch (e) { return null; }
  }
  setInterval(async () => {
    const server = await serverBytes();
    const sw = await chunkStats().catch(() => null);
    const mib = (n) => (n / 1048576).toFixed(2);
    netEl.textContent =
      `server: ${server ? `${server.requests} chunk requests, ` +
        `${mib(server.bytes)} MiB on the wire` : 'n/a'}\n` +
      `worker: ${sw ? `${sw.hits} cache hits, ${sw.misses} misses, ` +
        `${mib(sw.bytesFromNetwork)} MiB fetched` : 'n/a'}`;
  }, 2000);

  /*
   * Home-screen detection, by framebuffer -- read out of GUEST memory by the
   * emulator itself (hw/arm/ipod_touch_fb_probe.c), not out of the display
   * backend.
   *
   * Two reasons. SpringBoard never announces itself on serial, so pixels are
   * the only honest signal; and -display wasm costs enough time to change the
   * answer (kernel at 276 s with it, 118 s without, on otherwise identical
   * chunked boots). The probe samples the same three bases fb-snapshot.py
   * does, on a QEMU timer, and publishes them under a seqlock.
   *
   * The bar is fb-snapshot.py's: 1.0's home screen measures 59.04% non-black
   * natively, the Apple logo about 1.6%. Two consecutive samples over 25% is
   * the landmark.
   */
  const HOME_SCREEN_PCT = 25;
  const FB_NAMES = ['iboot 0x0fe00000', 'kernel 0x0f400000',
                    'kernel 0x0f496000'];
  let probeBase = -1;
  let probeBroken = false;
  let nonBlackPct = 0;
  let frames = 0;
  let homeStreak = 0;
  let guestMs = 0;

  function readProbe(u32) {
    for (let attempt = 0; attempt < 4; attempt++) {
      const s0 = Atomics.load(u32, probeBase);
      if (s0 & 1) continue;                       // writer in progress
      const samples = u32[probeBase + 1];
      const permille = [u32[probeBase + 2], u32[probeBase + 3],
                        u32[probeBase + 4]];
      const guest = u32[probeBase + 5];
      if (Atomics.load(u32, probeBase) !== s0) continue;
      return { seq: s0, samples, permille, guest };
    }
    return null;
  }

  function sampleFramebuffer() {
    // Every Module property goes through try/catch: reading one Emscripten did
    // not export calls abort() and takes the emulator with it, and measurement
    // must never be able to end a run.
    if (!fsModule || probeBroken) return;
    try {
      if (probeBase < 0) {
        const fn = fsModule._it_fb_probe_addr;
        if (typeof fn !== 'function') return;
        probeBase = fn() >>> 2;
        line(`framebuffer probe at 0x${(probeBase << 2).toString(16)}`);
      }
      const probe = readProbe(fsModule.HEAPU32);
      if (!probe || !probe.samples) return;
      frames = probe.samples;
      guestMs = probe.guest;
      // The kernel bases are what a home screen lands in; iBoot's logo base is
      // reported but never counted, or the Apple logo would qualify.
      nonBlackPct = Math.max(probe.permille[1], probe.permille[2]) / 10;
      if (probe.permille.some((p) => p > 0)) note('__pixels');
      homeStreak = nonBlackPct >= HOME_SCREEN_PCT ? homeStreak + 1 : 0;
      if (homeStreak >= 2) note('__home');
      fbEl.textContent = FB_NAMES
        .map((name, i) => `${(probe.permille[i] / 10).toFixed(1)}%  ${name}`)
        .join('\n') + `\nguest ${(probe.guest / 1000).toFixed(1)}s virtual`;
    } catch (e) {
      probeBroken = true;
      line(`framebuffer probe disabled: ${e}`, 'err');
    }
  }
  setInterval(sampleFramebuffer, 2000);

  const { default: Module } = await import('./qemu-system-arm.js');

  let manifest = null;
  if (MODE === 'chunked') {
    if (USE_SW) {
      state('registering service worker…');
      await registerChunkWorker('/sw.js');
      if (COLD) {
        postToChunkWorker('clear-cache');
        await new Promise((r) => setTimeout(r, 500));
      }
      postToChunkWorker('reset-stats');
    }
    await fetch('/__chunk-stats/reset').catch(() => {});
    manifest = await loadManifest(CHUNK_BASE);
    line(`manifest: ${manifest.chunks} chunks of ${manifest.pagesPerChunk} ` +
         `pages, prefetch ${manifest.prefetch.length} chunks = ` +
         `${(manifest.prefetchBytes / 1048576).toFixed(1)} MiB` +
         `${USE_SW ? '' : ' — service worker BYPASSED'}`);
  }

  await Module({
    arguments: [
      '-M', 'iPhone-2G,bootrom=/fw/bootrom,iboot=/fw/iboot.bin,' +
            'nand=/fw/nand,epoch=0',
      '-m', '1G',
      '-pflash', '/fw/nor.bin',
      // -display wasm publishes the surface into the wasm heap (ui/wasm.c,
      // Session A). This page never paints it; it only measures how much of it
      // is non-black, which is how a home screen is verified everywhere else in
      // this repo (scripts/fb-snapshot.py).
      '-display', DISPLAY,
      '-serial', 'file:/fw/serial.log',
      // Non-negotiable: at anything slower the guest takes timeout paths and
      // panics, natively as well as here.
      '-icount', 'shift=1',
    ],
    preRun: [async (mod) => {
      fsRef = mod.FS;
      fsModule = mod;
      globalThis.__fs = mod.FS;
      mod.FS.mkdir('/fw');

      // tcg/wasm64.c reads this: a browser cannot set an environment
      // variable, but it can write a file before startup.
      mod.FS.writeFile('/fw/jit-tune',
        `instantiate=${INSTANTIATE}\nmax_instances=${MAX_INSTANCES}\n` +
        `adaptive=${ADAPTIVE ? 1 : 0}\n`);

      let staged = 0;
      for (const [dst, src] of [['/fw/bootrom', 'bootrom'],
                                ['/fw/iboot.bin', 'iboot.bin'],
                                ['/fw/nor.bin', 'nor.bin']]) {
        state(`downloading ${src}…`);
        const data = new Uint8Array(await (await fetch(src)).arrayBuffer());
        mod.FS.writeFile(dst, data);
        staged += data.length;
      }

      if (MODE === 'chunked') {
        state('staging the pack index…');
        staged += await stageChunkedNand(mod.FS, manifest);
        // Without an overlay the guest's writes are discarded and the boot
        // stalls after launchd for ever: daemons that must create state spin.
        // overlay=ram keeps them in the heap -- the file-backed mode cannot be
        // used here, because every MEMFS stat() is proxied to the main thread
        // and the boot stalls outright.
        if (WRITABLE) mod.FS.writeFile('/fw/nand/nand-tune', 'overlay=ram\n');
        if (PREFETCH && USE_SW) {
          state('prefetching the boot working set…');
          const pending = prefetchBootSet(manifest, {
            onProgress: (m) => line(`prefetch ${m.done}/${m.total} chunks ` +
              `(${(m.stats.bytesFromNetwork / 1048576).toFixed(1)} MiB)`),
          }).then((done) => line(
            `prefetch complete in ${done.seconds.toFixed(1)}s, ` +
            `${(done.stats.bytesFromNetwork / 1048576).toFixed(2)} MiB`))
            .catch((e) => line(`prefetch failed: ${e}`, 'err'));
          if (AWAIT_PREFETCH) {
            await pending;
          }
        }
      } else {
        mod.FS.mkdir('/fw/nand');
        for (let b = 0; b < 8; b++) mod.FS.mkdir(`/fw/nand/bank${b}`);
        state('downloading nand.pack (215.6 MiB)…');
        const data = new Uint8Array(
          await (await fetch('/public/jit-boot/nand.pack')).arrayBuffer());
        mod.FS.writeFile('/fw/nand/nand.pack', data);
        if (WRITABLE) mod.FS.writeFile('/fw/nand/nand-tune', 'overlay=ram\n');
        staged += data.length;
      }
      state(`booting — ${(staged / 1048576).toFixed(1)} MiB staged`);
    }],
    // The fetch worker has to be started by the PAGE (see startChunkFetcher),
    // and only once the runtime exports exist -- preRun is too early.
    onRuntimeInitialized: () => {
      if (MODE !== 'chunked') return;
      startChunkFetcher(fsModule, {
        script: manifest.fetcher || '/chunk-fetch-worker.js',
        onError: (m) => line(`chunk fetch failed: ${m.url}: ${m.message}`, 'err'),
      }).then(() => line('chunk fetch worker is watching the mailbox'))
        .catch((e) => line(`chunk fetch worker: ${e.message}`, 'err'));
    },
    print: (t) => { note(t); line(t); },
    printErr: (t) => {
      if (/unsupported syscall/.test(t)) return;
      note(t);
      line(t, 'err');
    },
  });
</script>
